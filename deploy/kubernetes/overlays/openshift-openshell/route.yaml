apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: omnigent
  labels:
    app: omnigent
  annotations:
    haproxy.router.openshift.io/timeout: 5m
spec:
  host: omnigent.apps.ocp-gb.ibm.redhataicatalyst.com
  to:
    kind: Service
    name: omnigent
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
