apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnigent-to-openshell-gateway
  labels:
    app: omnigent
spec:
  podSelector:
    matchLabels:
      app: omnigent
  policyTypes:
    - Egress
  egress:
    # DNS — required for any name resolution (kube-dns / CoreDNS).
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        # OpenShift's dns-default Service targets DNS pods on port 5353.
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
    # Database — the base config connects via DATABASE_URL on port 5432.
    # Tighten the CIDR to your database host or use a namespaceSelector
    # if the database runs in-cluster.
    - ports:
        - protocol: TCP
          port: 5432
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: omnigent
          podSelector:
            matchLabels:
              app: omnigent-postgres
              component: postgres
    # OpenShell gateway gRPC — replace the CIDR with your gateway's
    # actual endpoint to restrict egress to only that host.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8080
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshell-poc
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: openshell
              app.kubernetes.io/name: openshell
    # Keycloak OIDC discovery and token exchange via the OpenShift route.
    # NetworkPolicy cannot match DNS names; keep these route IPs in sync if
    # the router load balancer address changes.
    - ports:
        - protocol: TCP
          port: 443
      to:
        - ipBlock:
            # change to keycloak ip
            cidr: 158.176.174.78/32
        - ipBlock:
            # change to keycloak ip
            cidr: 141.125.157.234/32
