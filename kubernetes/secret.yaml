apiVersion: v1
kind: Secret
metadata:
  name: omnigent-secrets
  namespace: poc-omnigent
  labels:
    app: omnigent
    autopoc.io/project: omnigent
type: Opaque
stringData:
  # SQLite backing store on the (ephemeral) /data volume. A single-file DB
  # keeps the PoC to one pod; re-initialized on each pod start via migrations.
  DATABASE_URL: "sqlite:////data/omnigent.db"
  # Session cookie secret (generated: openssl rand -hex 32).
  OMNIGENT_ACCOUNTS_COOKIE_SECRET: "a600572af5e737b6a00b108f5b9ec38c7be57d620af6b046d0d29addc477b233"
