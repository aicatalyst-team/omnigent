apiVersion: v1
kind: ConfigMap
metadata:
  name: omnigent-config
  namespace: poc-omnigent
  labels:
    app.kubernetes.io/managed-by: autopoc
    autopoc.io/project: omnigent
data:
  HOST: "0.0.0.0"
  PORT: "8000"
  ARTIFACT_DIR: "/data/artifacts"
  OMNIGENT_AUTH_ENABLED: "0"
  OMNIGENT_ADMIN_CREDENTIALS_PATH: "/data/admin-credentials"
  OMNIGENT_ACCOUNTS_AUTO_OPEN: "0"
