apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: poc-omnigent
  labels:
    app: postgres
    app.kubernetes.io/managed-by: autopoc
    autopoc.io/project: omnigent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/managed-by: autopoc
        autopoc.io/project: omnigent
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: "omnigent"
            - name: POSTGRES_USER
              value: "omnigent"
            - name: POSTGRES_PASSWORD
              value: "autopoc-test-pw"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
